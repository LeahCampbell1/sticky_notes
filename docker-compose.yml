services:
  web:
    build: .
    image: leahcampbell/sticky-notes-web:latest
    container_name: sticky-notes-web

    ports:
      - "8000:8000"

    env_file:
      - .env

    environment:
      DB_PATH: /app/data/db.sqlite3

    volumes:
      - sqlite_data:/app/data
      - static_data:/app/staticfiles

    command: >
      sh -c "python manage.py migrate --noinput && python manage.py collectstatic --noinput && gunicorn sticky_notes.wsgi:application --bind 0.0.0.0:8000 --workers 1 --access-logfile - --error-logfile -"

    restart: unless-stopped

volumes:
  sqlite_data:
  static_data:
